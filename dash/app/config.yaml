
theme:
  bg: "#000000"          # background color
  fg: "#FFFFFF"          # text color
  font_family: "Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif"
  quote_font_px: 48      # starting size; frontend clamps to fit
  author_font_px: 30
  max_width_px: 720      # keep text readable on 800x480

fallback_quotes:
  - { q: "Simplicity is the ultimate sophistication.", a: "Leonardo da Vinci" }

ninjaquotes:
  api_key_env_var: "NINJA_API_KEY"
  # Categories to randomly sample from for the quote query
  topics: ["wisdom", "life", "truth", "humor", "courage", "art", "nature", "freedom"]

weather:
  lat: 35.2216 
  lon: -80.8401 

rotation:
  sequence: ["ninjaquotes", "zenquotes", "weather"]
  durations_seconds:
    weather: 60
    zenquotes: 60
    ninjaquotes: 60
