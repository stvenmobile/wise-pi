# how often the frontend should refresh (also backend cache TTL)
refresh_seconds: 500

theme:
  bg: "#000000"          # background color
  fg: "#FFFFFF"          # text color
  font_family: "Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif"
  quote_font_px: 48      # starting size; frontend clamps to fit
  author_font_px: 30
  max_width_px: 720      # keep text readable on 800x480

fallback_quotes:
  - { q: "Simplicity is the ultimate sophistication.", a: "Leonardo da Vinci" }
  - { q: "What you do is who you are.", a: "Ben Horowitz" }

ninjaquotes:
  api_key_env_var: "NINJA_API_KEY"
  # Categories to randomly sample from for the quote query
  topics: ["wisdom", "life", "truth", "humor", "success", "courage", "happiness", "art", "nature", "freedom"]

weather:
  # The API key is now loaded from the OPENWEATHER_API_KEY environment variable.
  lat: 35.2216 
  lon: -80.8401 
  display_duration_seconds: 20
  quote_interval: 5

rotation:
  sequence: ["ninjaquotes", "quote", "weather", "ninjaquotes", "quote", "weather"]
  durations_seconds:
    weather: 300
    quote: 1800
    ninjaquotes: 1800
    art: 1200
