<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wise Display</title>
  <link rel="stylesheet" href="/static/styles.css?v=1.5" /> 
</head>
<body>
  <main id="app">
    <div id="container">
        
        <div id="quote-display">
            <div id="quote" aria-live="polite"></div>
            <div id="author"></div>
        </div>
        
        <div id="art-display" style="display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
            <img id="art-image" style="max-width: 90%; max-height: 70vh; margin-bottom: 10px;">
            <div id="art-title" style="font-size: 24px;"></div>
            <div id="art-artist" style="font-size: 18px; font-weight: 300;"></div>
        </div>
        
        <div id="current-display">
            <div id="main-temp-line">
                <div id="main-icon-container"></div>
                <div id="main-text" aria-live="polite"></div>
            </div>
            <div id="sub-text"></div>
        </div>
        
        <div id="forecast-grid">
            </div>
    </div>
  </main>
  <script>
    let theme = {
      bg: "#000", fg: "#fff",
      font_family: "system-ui, sans-serif",
      quote_font_px: 20, author_font_px: 12, max_width_px: 400
    };
    
    // --- Helper Functions ---
    async function loadTheme() {
      try {
        const r = await fetch("/api/theme");
        if (r.ok) theme = await r.json();
      } catch {}
      document.documentElement.style.setProperty("--bg", theme.bg);
      document.documentElement.style.setProperty("--fg", theme.fg);
      document.documentElement.style.setProperty("--font", theme.font_family);
      document.documentElement.style.setProperty("--quote-size", theme.quote_font_px + "px");
      document.documentElement.style.setProperty("--author-size", theme.author_font_px + "px");
      document.documentElement.style.setProperty("--maxw", theme.max_width_px + "px");
    }

    // *** fitText function removed for stability ***
    function fitText(el, basePx) {
      // Stub function to be removed if dynamic resizing is not needed.
    }

    function setDisplayMode(mode) {
      // Function to control visibility based on the current content type
      document.getElementById('quote-display').style.display = (mode === 'quote') ? 'flex' : 'none';
      document.getElementById('art-display').style.display = (mode === 'art') ? 'flex' : 'none';
      document.getElementById('current-display').style.display = (mode === 'weather') ? 'flex' : 'none';
      document.getElementById('forecast-grid').style.display = (mode === 'weather') ? 'flex' : 'none';
    }


// --- Main Content Loader ---
    async function loadContent() {
      try {
        const fetchUrl = "/api/content"; 
        const r = await fetch(fetchUrl); 
        
        if (!r.ok) {
            // SILENT RETRY: HTTP Error (e.g. 503)
            setTimeout(loadContent, 2000);
            return;
        }

        const j = await r.json();

        // 1. Handle Quotes (ZenQuotes, NinjaQuotes)
        if (j.type === 'quote' || j.type === 'zenquotes' || j.type === 'ninjaquotes') {
            // Backend might wrap it in "content" or send flat JSON. Handle both.
            const content = j.content || j; 
            
            // GUARD CLAUSE: Strict check to ensure text exists and is NOT "undefined"
            if (content.quote && content.author && content.quote !== "undefined") {
                 setDisplayMode('quote');
                 document.getElementById("quote").textContent = "“" + content.quote + "”";
                 document.getElementById("author").textContent = "— " + content.author;
            } else {
                // Silent Retry: Data was missing or invalid. Try next source.
                setTimeout(loadContent, 2000);
                return;
            }

        } else if (j.type === 'weather') {
            const content = j.content;
            if (!content || !content.weather) { setTimeout(loadContent, 2000); return; }

            setDisplayMode('weather');
            const weatherData = content.weather; 
            const forecast = weatherData.forecast; 
            const current = weatherData.current;   
            const quoteData = content.quote;
            
            // Render Weather
            if (Array.isArray(forecast) && forecast.length > 0) {
                const today = forecast[0];
                document.getElementById("main-icon-container").innerHTML = `<img src="https://openweathermap.org/img/wn/${today.icon}@2x.png" class="main-weather-icon" alt="${today.desc}">`;
                document.getElementById("main-text").textContent = `${Math.round(today.temp)}°F`; 
                document.getElementById("sub-text").innerHTML = `${today.desc.toUpperCase()} <span class="weather-metrics">Press: ${current.pressure}hPa Hum: ${current.humidity}%</span>`;

                const forecastGridEl = document.getElementById("forecast-grid");
                forecastGridEl.innerHTML = "";
                weatherData.forecast.forEach((day, index) => {
                    const date = new Date(day.day);
                    const dayString = index === 0 ? "TODAY" : date.toLocaleDateString(undefined, { weekday: 'short' });
                    const item = document.createElement('div');
                    item.className = 'forecast-item';
                    item.innerHTML = `<div class="forecast-day">${dayString.toUpperCase()}</div><img src="https://openweathermap.org/img/wn/${day.icon}@2x.png" class="weather-icon" alt="${day.desc}"><div class="forecast-temp">${Math.round(day.temp)}°F</div>`;
                    forecastGridEl.appendChild(item);
                });
            }
            
            // Render Weather Quote (Safely)
            if (quoteData && quoteData.quote && quoteData.quote !== "undefined") {
                document.getElementById("weather-quote").textContent = "“" + quoteData.quote + "”";
                document.getElementById("weather-author").textContent = "— " + quoteData.author;
            } else {
                document.getElementById("weather-quote").textContent = "";
                document.getElementById("weather-author").textContent = "";
            }

        } else if (j.type === 'art' || j.type === 'harvard' || j.type === 'smithsonian' || j.type === 'flickr') {
            const imageContent = j.content;
            
            if (imageContent && imageContent.image_url) {
                setDisplayMode(j.type); 
                document.getElementById("art-image").src = imageContent.image_url;
                
                // Flickr has no title/artist text
                if (j.type !== 'flickr') {
                    document.getElementById("art-title").textContent = imageContent.title || "";
                    document.getElementById("art-artist").textContent = (imageContent.artist || imageContent.date) ? 
                        `By: ${imageContent.artist || ""} (${imageContent.date || ""})` : "";
                } else {
                    document.getElementById("art-title").textContent = ""; 
                    document.getElementById("art-artist").textContent = "";
                }
            } else {
                // Silent Retry: Image URL missing
                setTimeout(loadContent, 2000);
                return; 
            }
        
        } else {
          // Silent Retry: Unknown Type
          setTimeout(loadContent, 2000);
          return;
        }

      } catch (e) {
        // Silent Retry: Network Error / JSON Parse Error
        setTimeout(loadContent, 2000);
      }
    }


    async function boot() {
      await loadTheme();
    
      // *** ADD 3-SECOND DELAY FOR NETWORK SETTLEMENT ***
      const startupDelayMs = 3000; 
      console.log(`Starting in ${startupDelayMs / 1000} seconds to allow network to stabilize.`);

      // Wait before loading the first content
      await new Promise(resolve => setTimeout(resolve, startupDelayMs));
      // **********************************************

      await loadContent(); // Initial load

      // Use a fixed 60-second TTL for subsequent intervals
      const ttl = 60000; 
      setInterval(loadContent, ttl);
    }
     
    // Window resize handler removed for stability

    boot();
  </script>
</body>
</html>
