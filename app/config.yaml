# how often the frontend should refresh (also backend cache TTL)
refresh_seconds: 60

theme:
  bg: "#000000"          # background color
  fg: "#FFFFFF"          # text color
  font_family: "Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif"
  quote_font_px: 72      # starting size; frontend clamps to fit
  author_font_px: 48
  max_width_px: 1500      # keep text readable on 800x480

fallback_quotes:
  - { q: "Simplicity is the ultimate sophistication.", a: "Leonardo da Vinci" }
  - { q: "What you do is who you are.", a: "Ben Horowitz" }

weather:
  lat: 35.2216
  lon: -80.8401
  display_duration_seconds: 20
  quote_interval: 5

flickr:
  api_key_env_var: "FLICKR_API_KEY"
  secret_env_var: "FLICKR_SECRET"
  user_id: stven
  photoset_id: null
  tags: ""

smithsonian:
  api_key_env_var: "SMITHSONIAN_API_KEY"
  display_duration_seconds: 60

rotation:
  sequence: ["flickr","quote","smithsonian","quote","flickr","quote","weather"]
  durations_seconds:
    weather: 45
    quote: 45
    flickr: 45
    smithsonian: 45

