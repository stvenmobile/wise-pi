# how often the frontend should refresh (also backend cache TTL)
refresh_seconds: 60

theme:
  bg: "#000000"          # background color
  fg: "#FFFFFF"          # text color
  font_family: "Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif"
  quote_font_px: 72      # starting size; frontend clamps to fit
  author_font_px: 48
  max_width_px: 1500      # keep text readable on 800x480

weather:
  lat: 35.2271
  lon: -80.8409

ninjaquotes:
  api_key_env_var: "NINJA_API_KEY"
  # Categories to randomly sample from for the quote query
  topics: ["wisdom", "life", "truth", "humor", "success", "courage", "happiness", "art", "nature", "freedom"]

flickr:
  api_key_env_var: "FLICKR_API_KEY"
  secret_env_var: "FLICKR_SECRET"
  user_id: stven
  photoset_id: null
  tags: ""

smithsonian:
  api_key_env_var: "SMITHSONIAN_API_KEY"

harvard:
  api_key_env_var: "HARVARD_API_KEY"

rotation:
  sequence: ["flickr","harvard","weather","flickr","smithsonian","ninjaquotes","flickr","harvard","zenquotes"] 
  # sequence: ["flickr ","weather"] 
durations_seconds:
    weather: 120
    ninjaquotes: 120
    zenquotes: 120
    flickr: 120
    smithsonian: 120
    harvard: 120
