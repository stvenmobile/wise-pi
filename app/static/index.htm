<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wise Display</title>
  <link rel="stylesheet" href="/static/styles.css?v=1.6" /> 
</head>
<body>
  <main id="app">
    <div id="container">
        
        <div id="quote-display">
            <div id="quote" aria-live="polite"></div>
            <div id="author"></div>
        </div>
        
        <div id="art-display">
            <img id="art-image">
            <div id="art-title"></div>
            <div id="art-artist"></div>
        </div>
        
        <div id="current-display">
            <div id="main-temp-line">
                <div id="main-icon-container"></div>
                <div id="main-text" aria-live="polite"></div>
            </div>
            <div id="sub-text"></div>
        </div>

        <div id="weather-iframe-display" style="display: none; height: 100vh; width: 100vw; position: absolute;">
            <iframe id="wunderground-iframe" style="height: 100%; width: 100%; border: none;"></iframe>
        </div>        

        <div id="forecast-grid">
        </div>

    </div>
  </main>
  <script>
    let theme = {
      bg: "#000", fg: "#fff",
      font_family: "system-ui, sans-serif",
      quote_font_px: 20, author_font_px: 12, max_width_px: 400
    };
    
    // --- Helper Functions ---
    async function loadTheme() {
      try {
        const r = await fetch("/api/theme");
        if (r.ok) theme = await r.json();
      } catch {}
      document.documentElement.style.setProperty("--bg", theme.bg);
      document.documentElement.style.setProperty("--fg", theme.fg);
      document.documentElement.style.setProperty("--font", theme.font_family);
      document.documentElement.style.setProperty("--quote-size", theme.quote_font_px + "px");
      document.documentElement.style.setProperty("--author-size", theme.author_px + "px");
      document.documentElement.style.setProperty("--maxw", theme.max_width_px + "px");
    }

    function fitText(el, basePx) {
      // Stub function to be removed if dynamic resizing is not needed.
    }

    function setDisplayMode(mode) {
      // Function to control visibility based on the current content type
      document.getElementById('quote-display').style.display = (mode === 'quote') ? 'flex' : 'none';
      document.getElementById('art-display').style.display = (mode === 'art' || mode === 'flickr' || mode === 'harvard' || mode === 'smithsonian') ? 'flex' : 'none';
      
      // Control for WUNDERGROUND IFRAME MODE
      document.getElementById('weather-iframe-display').style.display = (mode === 'weather') ? 'flex' : 'none';

      // Hide all standard forecast elements during weather mode
      document.getElementById('current-display').style.display = 'none';
      document.getElementById('forecast-grid').style.display = 'none';

      // Reset image classes before setting new mode
      document.getElementById('art-display').classList.remove('flickr-mode', 'rich-mode');
      
      if (mode === 'flickr') {
          document.getElementById('art-display').classList.add('flickr-mode');
      } else if (mode === 'art' || mode === 'harvard' || mode === 'smithsonian') {
          document.getElementById('art-display').classList.add('rich-mode');
      }
    }

    // --- Main Content Loader ---
    async function loadContent() {
      // Quote/Author elements
      const quoteEl = document.getElementById("quote");
      const authorEl = document.getElementById("author");
      
      // Art elements
      const artDisplayEl = document.getElementById("art-display"); // Need the container element
      const artImageEl = document.getElementById("art-image");
      const artTitleEl = document.getElementById("art-title");
      const artArtistEl = document.getElementById("art-artist");

      // Weather elements
      const mainEl = document.getElementById("main-text");
      const subEl = document.getElementById("sub-text");
      const iconContainerEl = document.getElementById("main-icon-container");
      const gridEl = document.getElementById("forecast-grid");

      // Initial state reset
      quoteEl.textContent = "Loading...";
      authorEl.textContent = "Please wait...";
      iconContainerEl.innerHTML = "";
      gridEl.innerHTML = ""; 

      try {
        const fetchUrl = "/api/content"; 
        const r = await fetch(fetchUrl); 
        
        if (!r.ok) {
            const errorData = await r.json();
            throw new Error(errorData.error || `API returned status ${r.status}`);
        }

        const j = await r.json();

        // --- LOGIC SPLIT: QUOTE VS. WEATHER VS. IMAGE ---

        if (j.type === 'quote') {
            // --- QUOTE MODE ---
            setDisplayMode('quote');
            
            quoteEl.textContent = "“" + j.quote + "”";
            authorEl.textContent = "— " + j.author;

        } else if (j.type === 'weather') {
            // --- WUNDERGROUND IFRAME MODE ---
            // The content object from the backend is expected to be {external_url: "..."}
            
            const content = j.content;
            
            // Check for the expected key and switch the iframe source
            if (content && content.external_url) {
                setDisplayMode('weather');
                document.getElementById('wunderground-iframe').src = content.external_url;
            } else {
                // Fallback for an error where weather data structure is wrong
                setDisplayMode('quote');
                quoteEl.textContent = "Weather URL Error";
                authorEl.textContent = "Backend failed to provide external URL.";
            }

        } else if (j.type === 'art' || j.type === 'harvard' || j.type === 'smithsonian') {
            // --- RICH METADATA IMAGE MODE (Met, Harvard, Smithsonian) ---
            setDisplayMode(j.type); // Sets the mode and applies rich-mode class via setDisplayMode
            const imageContent = j.content;
            
            // CRITICAL FIX: Ensure imageContent and the URL exist before processing 
            if (imageContent && imageContent.image_url) {
                artImageEl.src = imageContent.image_url;
                
                // Fill metadata fields (title/artist/date should be present)
                artTitleEl.textContent = imageContent.title || "";
                
                // Handles structure from Met, Harvard, and Smithsonian APIs (Artist/Date combo)
                artArtistEl.textContent = (imageContent.artist || imageContent.date) ? 
                    `By: ${imageContent.artist || ""} (${imageContent.date || ""})` : "";
            } else {
                setDisplayMode('quote');
                quoteEl.textContent = "Rich Art fetch failed.";
                authorEl.textContent = "Check service logs for API error details.";
            }

        } else if (j.type === 'flickr') {
            // --- FLICKR IMAGE MODE (Simplified URL Only) ---
            setDisplayMode(j.type); // Sets the mode and applies flickr-mode class via setDisplayMode
            const imageContent = j.content;
            
            // CRITICAL FIX: Ensure imageContent is valid before processing 
            if (imageContent && imageContent.image_url) {
                artImageEl.src = imageContent.image_url;
                
                // Clear title/artist fields explicitly for Flickr (as they are not wanted)
                artTitleEl.textContent = ""; 
                artArtistEl.textContent = ""; 
            } else {
                setDisplayMode('quote');
                quoteEl.textContent = "Flickr fetch failed.";
                authorEl.textContent = "Check service logs for API error details.";
            }
        
        } else {
          // Fallback if API returns 200 OK but with an unhandled type (should be impossible now)
          setDisplayMode('quote');
          quoteEl.textContent = "Error: Unexpected data format.";
          authorEl.textContent = `Type "${j.type}" was not recognized.`;
        }

      } catch (e) {
        // Network or API failure 
        setDisplayMode('quote');
        quoteEl.textContent = "Application Error";
        authorEl.textContent = e.message || "Check service logs.";
      }
    }

    async function boot() {
      await loadTheme();
    
      // *** ADD 3-SECOND DELAY FOR NETWORK SETTLEMENT ***
      const startupDelayMs = 3000; 
      console.log(`Starting in ${startupDelayMs / 1000} seconds to allow network to stabilize.`);

      // Wait before loading the first content
      await new Promise(resolve => setTimeout(resolve, startupDelayMs));
      // **********************************************

      await loadContent(); // Initial load

      // Use a fixed 60-second TTL for subsequent intervals
      const ttl = 60000; 
      setInterval(loadContent, ttl);
    }
     
    // Window resize handler removed for stability

    boot();
  </script>
</body>
</html>
