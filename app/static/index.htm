<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wise Display</title>
  <link rel="stylesheet" href="/static/styles.css?v=1.9" /> 
</head>
<body>
  <main id="app">
    <div id="container">
        
        <div id="quote-display">
            <div id="quote" aria-live="polite"></div>
            <div id="author"></div>
        </div>
        
        <div id="art-display">
            <img id="art-image">
            <div id="art-title"></div>
            <div id="art-artist"></div>
        </div>
        
        <div id="weather-display">
            
            <div id="weather-forecast-panel">
                <div id="current-display">
                    <div id="main-temp-line">
                        <div id="main-icon-container"></div>
                        <div id="main-text" aria-live="polite"></div>
                    </div>
                    <div id="sub-text"></div>
                </div>
                
                <div id="forecast-grid">
                    </div>
            </div>
            
            <div id="weather-quote-panel">
                <div id="weather-quote"></div>
                <div id="weather-author"></div>
            </div>
        </div>
        </div>
  </main>
  <script>
    let theme = {
      bg: "#000", fg: "#fff",
      font_family: "system-ui, sans-serif",
      quote_font_px: 20, author_font_px: 12, max_width_px: 400
    };
    
    // --- Helper Functions ---
    async function loadTheme() {
      try {
        const r = await fetch("/api/theme");
        if (r.ok) theme = await r.json();
      } catch {}
      document.documentElement.style.setProperty("--bg", theme.bg);
      document.documentElement.style.setProperty("--fg", theme.fg);
      document.documentElement.style.setProperty("--font", theme.font_family);
      document.documentElement.style.setProperty("--quote-size", theme.quote_font_px + "px");
      
      // 💡 CRITICAL FIX: Changed theme.author_px to theme.author_font_px 💡
      document.documentElement.style.setProperty("--author-size", theme.author_font_px + "px");
      
      document.documentElement.style.setProperty("--maxw", theme.max_width_px + "px");
    }

    function fitText(el, basePx) {
      // Stub function to be removed if dynamic resizing is not needed.
    }

    function setDisplayMode(mode) {
      // Control visibility for all modes
      document.getElementById('quote-display').style.display = (mode === 'quote') ? 'flex' : 'none';
      document.getElementById('art-display').style.display = (mode === 'art' || mode === 'flickr' || mode === 'harvard' || mode === 'smithsonian') ? 'flex' : 'none';
      
      // Control Dual-Panel Weather Display
      document.getElementById('weather-display').style.display = (mode === 'weather') ? 'flex' : 'none';

      // Reset image classes before setting new mode
      document.getElementById('art-display').classList.remove('flickr-mode', 'rich-mode');
      
      if (mode === 'flickr') {
          document.getElementById('art-display').classList.add('flickr-mode');
      } else if (mode === 'art' || mode === 'harvard' || mode === 'smithsonian') {
          document.getElementById('art-display').classList.add('rich-mode');
      }
    }

    // --- Main Content Loader ---
    async function loadContent() {
      // Quote/Author elements
      const quoteEl = document.getElementById("quote");
      const authorEl = document.getElementById("author");
      
      // Art elements
      const artImageEl = document.getElementById("art-image");
      const artTitleEl = document.getElementById("art-title");
      const artArtistEl = document.getElementById("art-artist");

      // Weather elements (DUAL-PANEL TARGETS)
      const currentTextEl = document.getElementById("main-text");
      const subTextEl = document.getElementById("sub-text");
      const iconContainerEl = document.getElementById("main-icon-container");
      const forecastGridEl = document.getElementById("forecast-grid");
      const weatherQuoteEl = document.getElementById("weather-quote");
      const weatherAuthorEl = document.getElementById("weather-author");

      // Initial state reset (Clearing any previous error messages)
      quoteEl.textContent = "Loading...";
      authorEl.textContent = "Please wait...";
      
      try {
        const fetchUrl = "/api/content"; 
        const r = await fetch(fetchUrl); 
        
        if (!r.ok) {
            const errorData = await r.json();
            // Log the error but don't display it to the user.
            console.error("API Error Response:", errorData.error || `API returned status ${r.status}`);
            throw new Error("API call failed."); // Throw generic error to hit catch block
        }

        const j = await r.json();
        const content = j.content; // The fetched content payload

        // --- LOGIC SPLIT: QUOTE VS. WEATHER VS. IMAGE ---

        if (j.type === 'quote' || j.type === 'zenquotes' || j.type === 'ninjaquotes') {
            // --- STANDARD QUOTE MODE ---
            setDisplayMode('quote');
            
            // Access properties directly (no j.content wrapper for quotes)
            if (content && content.quote) { 
                quoteEl.textContent = "“" + content.quote + "”";
                authorEl.textContent = "— " + content.author;
            } else {
                // If content is empty/malformed, this is the final local fallback
                console.warn("Quote fetch succeeded but content was empty/malformed.");
                quoteEl.textContent = "“Content fetch failed.”";
                authorEl.textContent = "— Check logs for API error";
            }

        } else if (j.type === 'weather') {
            // --- DUAL-PANEL WEATHER/QUOTE MODE ---
            setDisplayMode('weather');
            
            const weatherData = content.weather; 
            const forecast = weatherData.forecast; 
            const current = weatherData.current;   
            const quoteData = content.quote;

            
            // 1. Render Current Weather and Forecast
            if (Array.isArray(forecast) && forecast.length > 0) {
                const today = forecast[0];
                
                // Current Display 
                iconContainerEl.innerHTML = `<img src="https://openweathermap.org/img/wn/${today.icon}@2x.png" class="main-weather-icon" alt="${today.desc}">`;
                currentTextEl.textContent = `${Math.round(today.temp)}°F`; 
                
                // Final corrected sub-text HTML
                subTextEl.innerHTML = `
                    ${today.desc.toUpperCase()} 
                    <span class="weather-metrics">
                        Press: ${current.pressure}hPa 
                        Hum: ${current.humidity}%
                    </span>
                `;

                // 5-Day Grid
                forecastGridEl.innerHTML = "";
                weatherData.forecast.forEach((day, index) => { // Use weatherData.forecast to iterate
                    const date = new Date(day.day);
                    const dayString = index === 0 ? "TODAY" : date.toLocaleDateString(undefined, { weekday: 'short' });
                    
                    const item = document.createElement('div');
                    item.className = 'forecast-item';
                    item.innerHTML = `
                        <div class="forecast-day">${dayString.toUpperCase()}</div>
                        <img src="https://openweathermap.org/img/wn/${day.icon}@2x.png" class="weather-icon" alt="${day.desc}">
                        <div class="forecast-temp">${Math.round(day.temp)}°F</div>
                    `;
                    forecastGridEl.appendChild(item);
                });
                
            } else {
                currentTextEl.textContent = "Weather data unavailable.";
                subTextEl.textContent = "Empty forecast array.";
            }
            
            // 2. Render Quote
            if (quoteData && quoteData.quote) {
                weatherQuoteEl.textContent = "“" + quoteData.quote + "”";
                weatherAuthorEl.textContent = "— " + quoteData.author;
            } else {
                weatherQuoteEl.textContent = "Quote failed.";
                weatherAuthorEl.textContent = "";
            }


        } else if (j.type === 'art' || j.type === 'harvard' || j.type === 'smithsonian') {
            // --- RICH METADATA IMAGE MODE (Met, Harvard, Smithsonian) ---
            setDisplayMode(j.type); 
            const imageContent = j.content;
            
            if (imageContent && imageContent.image_url) {
                artImageEl.src = imageContent.image_url;
                artTitleEl.textContent = imageContent.title || "";
                artArtistEl.textContent = (imageContent.artist || imageContent.date) ? 
                    `By: ${imageContent.artist || ""} (${imageContent.date || ""})` : "";
            } else {
                // If content is empty/malformed, this is the final local fallback
                setDisplayMode('quote');
                quoteEl.textContent = "Rich Art fetch failed.";
                authorEl.textContent = "Check service logs for API error details.";
            }

        } else if (j.type === 'flickr') {
            // --- FLICKR IMAGE MODE (Simplified URL Only) ---
            setDisplayMode(j.type); 
            const imageContent = j.content;
            
            if (imageContent && imageContent.image_url) {
                artImageEl.src = imageContent.image_url;
                artTitleEl.textContent = ""; 
                artArtistEl.textContent = ""; 
            } else {
                // If content is empty/malformed, this is the final local fallback
                setDisplayMode('quote');
                quoteEl.textContent = "Flickr fetch failed.";
                authorEl.textContent = "Check service logs for API error details.";
            }
        
        } else {
          // If the backend sends an unknown type, log it only
          console.error(`Received unknown content type: ${j.type}`);
          setDisplayMode('quote');
          quoteEl.textContent = "Error: Unexpected data format.";
          authorEl.textContent = `Type "${j.type}" was not recognized.`;
        }

      } catch (e) {
        // --- FINAL GLOBAL FAILURE CATCH ---
        // If a network error occurs or JSON is invalid, log it only
        console.error("Global fetch error:", e);
        setDisplayMode('quote');
        quoteEl.textContent = "Application Error";
        authorEl.textContent = e.message || "Check service logs.";
      }
    }

    async function boot() {
      await loadTheme();
    
      const startupDelayMs = 3000; 
      console.log(`Starting in ${startupDelayMs / 1000} seconds to allow network to stabilize.`);

      await new Promise(resolve => setTimeout(resolve, startupDelayMs));

      await loadContent(); // Initial load

      const ttl = 60000; 
      setInterval(loadContent, ttl);
    }

    boot();
  </script>
</body>
</html>
